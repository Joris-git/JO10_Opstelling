<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>JO10 Opstelling</title>
  <meta name="description" content="Eerlijk wisselschema, live wedstrijdbegeleiding en seizoensoverzicht voor JO10." />
  <meta name="theme-color" content="#e63946" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JO10" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e63946'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />

  <!-- Thema zo vroeg mogelijk zetten (geen flits van het verkeerde thema) -->
  <script>
    try {
      var t = localStorage.getItem('jo10_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <!-- Externe libs (vaste versies). De app werkt ook als deze niet laden.
       SheetJS is async: alleen nodig bij import/export, mag de app niet ophouden. -->
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Firebase wordt op de achtergrond geladen (in volgorde: app, dan database), zodat een trage
       verbinding langs de lijn de app niet ophoudt. Store koppelt zodra firebase.database bestaat. -->
  <script>
    (function () {
      var base = 'https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
      function load(file, next) {
        var s = document.createElement('script');
        s.src = base + file; s.async = true;
        if (next) s.onload = next;
        document.head.appendChild(s);
      }
      load('firebase-app-compat.js', function () { load('firebase-database-compat.js'); });
    })();
  </script>

  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/live.css" />

  <script defer src="js/config.js"></script>
  <script defer src="js/scheduler.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/io.js"></script>
  <script defer src="js/live.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Naar inhoud</a>

  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">⚽</span>
        <span class="brand__name">JO10 Opstelling</span>
      </div>
      <div class="header-actions">
        <span id="sync-dot" class="sync-dot" data-status="offline" role="status" title="Offline – lokaal opgeslagen" aria-label="Offline – lokaal opgeslagen"></span>
        <button type="button" id="theme-btn" class="hdr-btn" data-act="theme-cycle" aria-label="Thema: automatisch" title="Thema: automatisch">🌗</button>
      </div>
    </div>
  </header>

  <main id="main" class="app-main" tabindex="-1">
    <section id="screen-wedstrijd" class="screen" data-screen="wedstrijd" aria-label="Wedstrijd voorbereiden"><div class="container"><p class="boot-msg">Laden…</p></div></section>
    <section id="screen-live" class="screen" data-screen="live" aria-label="Live" hidden></section>
    <section id="screen-seizoen" class="screen" data-screen="seizoen" aria-label="Seizoen" hidden></section>
    <section id="screen-team" class="screen" data-screen="team" aria-label="Team" hidden></section>
    <noscript><div class="container"><div class="card">Deze app heeft JavaScript nodig.</div></div></noscript>
  </main>

  <nav class="tabbar" aria-label="Hoofdmenu">
    <button type="button" class="tab" data-act="go" data-screen="wedstrijd" aria-current="page"><span class="tab__icon" aria-hidden="true">⚽</span><span class="tab__label">Wedstrijd</span></button>
    <button type="button" class="tab" data-act="go" data-screen="live"><span class="tab__icon" aria-hidden="true">⏱️</span><span class="tab__label">Live</span></button>
    <button type="button" class="tab" data-act="go" data-screen="seizoen"><span class="tab__icon" aria-hidden="true">📊</span><span class="tab__label">Seizoen</span></button>
    <button type="button" class="tab" data-act="go" data-screen="team"><span class="tab__icon" aria-hidden="true">👥</span><span class="tab__label">Team</span></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
